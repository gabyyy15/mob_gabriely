<!DOCTYPE html>
<!--
  Moldura de celular para o Expo web.
  O Expo usa este arquivo como casca da pagina. Nao precisa importar nada
  no App.js. 390x844 e a medida util de um aparelho comum.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #2b2f36;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* o app inteiro vive dentro desta caixa */
    #root {
      width: 390px;
      height: 844px;
      max-height: 95vh;
      background: #fff;
      border-radius: 34px;
      overflow: hidden;
      box-shadow: 0 0 0 10px #111, 0 18px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
    }
    /* em tela pequena a moldura sai e o app ocupa tudo */
    @media (max-width: 480px) {
      #root {
        width: 100%;
        height: 100%;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
